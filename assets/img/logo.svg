<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Bushwacker Barber Shop">
  <title>Bushwacker Barber Shop</title>
  <!-- Drawn from the shop sign: weathered plank boards in barn red, cream and
       slate, rusted iron lettering, black pipe frame. -->
  <defs>
    <linearGradient id="bwRust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d68f4b"/>
      <stop offset="1" stop-color="#8d4f22"/>
    </linearGradient>
    <clipPath id="bwClip">
      <rect x="10" y="16" width="80" height="68" rx="5"/>
    </clipPath>
  </defs>

  <!-- Plank boards -->
  <g clip-path="url(#bwClip)">
    <rect x="10" y="16" width="80" height="68" fill="#efe7d9"/>
    <rect x="10" y="16" width="11.4" height="68" fill="#8b3a32"/>
    <rect x="32.9" y="16" width="11.4" height="68" fill="#4e626b"/>
    <rect x="55.7" y="16" width="11.4" height="68" fill="#8b3a32"/>
    <rect x="78.6" y="16" width="11.4" height="68" fill="#4e626b"/>
    <!-- Plank seams -->
    <g stroke="#1a120c" stroke-width="1" opacity=".35">
      <path d="M21.4 16v68M32.9 16v68M44.3 16v68M55.7 16v68M67.1 16v68M78.6 16v68"/>
    </g>
    <!-- Weathering -->
    <rect x="10" y="16" width="80" height="68" fill="#16110f" opacity=".14"/>
  </g>

  <!-- Rusted slab B. Drawn as a path so it renders the same everywhere —
       an SVG used as an <img> cannot load a webfont. -->
  <path fill-rule="evenodd" fill="url(#bwRust)" stroke="#3a2118" stroke-width="2"
        stroke-linejoin="round" paint-order="stroke"
        d="M30 28h26c9 0 14 5 14 12 0 5-3 8-7 9.5 5 1.5 9 5.5 9 11.5
           0 7-5 11-15 11H30Z
           M41 35v10h14c4 0 6-2 6-5 0-3-2-5-6-5Z
           M41 55v10h15c4 0 6-2 6-5 0-3-2-5-6-5Z"/>

  <!-- Black pipe frame -->
  <rect x="10" y="16" width="80" height="68" rx="5"
        fill="none" stroke="#241a15" stroke-width="6"/>
  <rect x="12.5" y="18.5" width="75" height="63" rx="3.5"
        fill="none" stroke="#efe7d9" stroke-width="1" opacity=".22"/>

  <!-- Frame mounts -->
  <g fill="#241a15">
    <rect x="16" y="8" width="6" height="12" rx="3"/>
    <rect x="78" y="8" width="6" height="12" rx="3"/>
    <rect x="16" y="80" width="6" height="12" rx="3"/>
    <rect x="78" y="80" width="6" height="12" rx="3"/>
  </g>
</svg>

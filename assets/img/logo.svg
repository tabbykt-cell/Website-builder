<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Bushwacker Barber Shop">
  <title>Bushwacker Barber Shop</title>
  <defs>
    <linearGradient id="bwBrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2b76b"/>
      <stop offset="1" stop-color="#a87c34"/>
    </linearGradient>
    <linearGradient id="bwPine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b5745"/>
      <stop offset="1" stop-color="#163026"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path d="M50 3 92 16v34c0 22-17 39-42 47C25 89 8 72 8 50V16z" fill="url(#bwPine)"/>
  <path d="M50 3 92 16v34c0 22-17 39-42 47C25 89 8 72 8 50V16z"
        fill="none" stroke="url(#bwBrass)" stroke-width="4.5"/>
  <path d="M50 10.5 85.5 21v29c0 18.5-14.5 33-35.5 40C29 83 14.5 68.5 14.5 50V21z"
        fill="none" stroke="#e2b76b" stroke-width="1" opacity=".45"/>

  <!-- Pine tree -->
  <g fill="#f3efe6">
    <path d="M50 20 41 36h18z"/>
    <path d="M50 31 38.5 50h23z"/>
    <path d="M50 43 35.5 65h29z"/>
  </g>
  <rect x="47.6" y="63" width="4.8" height="12" rx="1.2" fill="#c8974a"/>

  <!-- Crossed straight razors -->
  <g stroke="#c8974a" stroke-width="3.6" stroke-linecap="round" opacity=".95">
    <path d="M24 60 38 76"/>
    <path d="M76 60 62 76"/>
  </g>
  <g fill="#f3efe6">
    <circle cx="38.5" cy="77" r="3.4"/>
    <circle cx="61.5" cy="77" r="3.4"/>
  </g>
</svg>
